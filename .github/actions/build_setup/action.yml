name: Build Setup
description: Setup for standard Java builds

inputs:
  update-cache:
    description: If cache should be updated
    required: false
    default: 'false'
  ref:
    description: 'Ref to checkout'
    required: false

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.ref }}
    - name: Set up JDK
      uses: actions/setup-java@v4
      env:
        REF: ${{ inputs.ref || github.base_ref || github.ref }}
      with:
        distribution: temurin
        java-version: ${{ contains(env.REF, '26.1') && '25' || contains(env.REF, '1.21.1') && '21' || '17' }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-write-only: ${{ inputs.update-cache }}
        cache-read-only: ${{ github.ref != 'refs/heads/26.1' && github.ref != 'refs/heads/1.21.1' && github.ref != 'refs/heads/1.20.1' }}
        add-job-summary: 'on-failure'

    - name: Fetch AE2 Pattern Disk jar
      shell: bash
      env:
        # This mod depends on AE2 Pattern Disk compile-only, so its jar has to be on disk before Gradle
        # configures the project. Point this repository variable at the download URL of the
        # ae2_pattern_disk jar matching the branch (Modrinth, CurseForge and GitHub releases all serve
        # one); a local sibling checkout is used as-is when the variable is absent.
        PATTERN_DISK_JAR_URL: ${{ vars.PATTERN_DISK_JAR_URL }}
      run: |
        if [ -z "$PATTERN_DISK_JAR_URL" ]; then
          echo "::warning::Repository variable PATTERN_DISK_JAR_URL is not set. The AE2 Pattern Disk compatibility layer cannot be compiled unless the jar is provided some other way (for example a sibling checkout of that repository, which CI does not have)."
          exit 0
        fi
        mkdir -p "$RUNNER_TEMP/pattern-disk"
        curl -fsSL "$PATTERN_DISK_JAR_URL" -o "$RUNNER_TEMP/pattern-disk/ae2_pattern_disk.jar"
        echo "PATTERN_DISK_DEV_JAR=$RUNNER_TEMP/pattern-disk/ae2_pattern_disk.jar" >> "$GITHUB_ENV"
